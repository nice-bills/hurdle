# Same as foundry.toml plus write access to script/out for vm.writeJson, and the optimizer:
# without it HurdleVault's runtime is 28.4 KB (> 24,576 EIP-170 limit); with it, 18.3 KB.
# Use: FOUNDRY_CONFIG=script/foundry.deploy.toml forge script ...
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true
fs_permissions = [
    { access = "read-write", path = ".forge-snapshots/" },
    { access = "read-write", path = "script/out/" },
]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.26"
evm_version = "cancun"
